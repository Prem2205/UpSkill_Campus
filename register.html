<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register - ServiceHub</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>


<header>

    <h1>ServiceHub</h1>

    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="login.html">
            Login
        </a>

    </nav>

</header>


<div class="form-container">

    <h2>Create Account</h2>


    <form id="registerForm">

        <input
            type="text"
            id="name"
            placeholder="Full Name"
            required
        >


        <input
            type="email"
            id="email"
            placeholder="Email"
            required
        >


        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >


        <select id="role">

            <option value="customer">
                Customer
            </option>

            <option value="merchant">
                Merchant
            </option>

        </select>


        <div id="merchantFields"
             style="display:none;">

            <input
                type="text"
                id="businessName"
                placeholder="Business Name"
            >


            <select id="category">

                <option value="">
                    Select Category
                </option>

                <option>Home</option>

                <option>Beauty</option>

                <option>Pet</option>

                <option>Repair</option>

                <option>Fitness</option>

                <option>Education</option>

            </select>


            <textarea
                id="description"
                placeholder="Business Description"
            ></textarea>

        </div>


        <button type="submit">
            Register
        </button>

    </form>


    <p id="registerMessage"></p>

</div>


<script>

const API =
    "http://localhost:5000/api";


const role =
    document.getElementById("role");


const merchantFields =
    document.getElementById(
        "merchantFields"
    );


role.addEventListener(
    "change",
    function() {

        if (
            role.value ===
            "merchant"
        ) {

            merchantFields.style.display =
                "block";

        } else {

            merchantFields.style.display =
                "none";

        }

    }
);


document
    .getElementById("registerForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const data = {

                name:
                    document.getElementById(
                        "name"
                    ).value,

                email:
                    document.getElementById(
                        "email"
                    ).value,

                password:
                    document.getElementById(
                        "password"
                    ).value,

                role:
                    role.value,

                businessName:
                    document.getElementById(
                        "businessName"
                    ).value,

                category:
                    document.getElementById(
                        "category"
                    ).value,

                description:
                    document.getElementById(
                        "description"
                    ).value

            };


            const response =
                await fetch(
                    API + "/auth/register",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(data)
                    }
                );


            const result =
                await response.json();


            document.getElementById(
                "registerMessage"
            ).innerText =
                result.message;


            if (response.ok) {

                localStorage.setItem(
                    "token",
                    result.token
                );


                localStorage.setItem(
                    "user",
                    JSON.stringify(result.user)
                );


                setTimeout(
                    () => {

                        window.location.href =
                            "index.html";

                    },
                    1000
                );

            }

        }
    );

</script>

</body>

</html>
